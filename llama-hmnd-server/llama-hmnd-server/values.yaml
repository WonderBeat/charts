replicaCount: 1

nameOverride: ""
# Pod names will be dego-dev-throwaway-0
fullnameOverride: "dego-dev-throwaway"

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: "server-cuda"
  pullPolicy: IfNotPresent

server:
  host: "0.0.0.0"
  port: 8080
  # Unsloth dynamic quant. The ':UD-IQ4_XS' tag makes llama.cpp resolve and
  # fetch all 4 splits (00001..00004-of-00004, 127.3 GiB total) on its own, so
  # modelFile must stay empty: pinning one shard would defeat split resolution.
  model: "unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ4_XS"
  modelFile: ""
  # 127.3 GiB of weights cannot fit in one 80 GiB H100. Attention + shared
  # experts stay on GPU, routed expert banks spill to host RAM via cpuMoeLayers.
  gpuLayers: "all"
  # Keep the routed-expert banks of the first N of 43 layers in CPU RAM.
  # ~2.7 GiB of experts per layer, so 24 layers sheds ~62 GiB and leaves
  # headroom on the GPU for the KV cache and compute buffers.
  # Lower this if VRAM allows (faster); raise it on CUDA OOM at startup.
  #
  # Raised 24 -> 25 to buy ~2.7 GiB of VRAM headroom for the third KV slot
  # below. Measured before the change: 67555 / 81559 MiB used, so only 13.7 GiB
  # was free and 3 x 131072 of KV needs 32.3 GiB against the 21.5 GiB already
  # allocated. That left under 3 GiB of margin, which is too thin to survive a
  # future image bump; one more offloaded layer restores it.
  cpuMoeLayers: 25
  # Set via helmfile (secret.yaml)
  apiKey: ""
  extraArgs:
    # Recommended sampling for this model (agentic scenarios)
    - "--temp"
    - "1.0"
    - "--top-p"
    - "0.95"
    # Pinned to the current llama.cpp defaults rather than left implicit, so a
    # future image bump cannot silently move sampling under us. top-k runs
    # BEFORE top-p in the sampler chain, so leaving it at an implicit 40 also
    # meant the --top-p 0.95 above was never really what got applied.
    - "--top-k"
    - "40"
    - "--min-p"
    - "0.05"
    # Anti-degeneration guard. NOTE: as of 2026-08-05 the deployed pod was still
    # running repeat-penalty 1.05, i.e. the measured-bad value below: this file
    # had been tuned but never rolled out. If long-context looping is still
    # observed after this release, check the LIVE args (kubectl get pod -o
    # jsonpath='{.spec.containers[0].args}') before re-tuning anything, because
    # /props reports the server default and it is easy to tune a config that is
    # not actually in effect.
    #
    # Defaults are repeat_penalty=1.0 (off) with
    # repeat_last_n=64, which let the previous 2-bit build emit unbounded
    # "#I #I #I" runs. A light penalty over a wider window breaks those loops
    # without flattening legitimate repetition in code output.
    #
    # 1.05 was measurably not enough: on long generations the model still fell
    # into paraphrase loops ("at this exact file today at this precise
    # location today ..."). Measured degeneration rate over 6k-token
    # generations, 4 seeds on a loop-inducing prompt:
    #   repeat-penalty 1.05 / window 256   25% (2/8)   <- previous setting
    #   repeat-penalty 1.10 / window 256    0% (0/4)   <- this setting
    #   repeat-penalty 1.10 / window  64   75% (3/4)   <- window too narrow
    #   DRY (multiplier 0.8) instead of rp 75% (3/4)   <- markedly worse
    # The wide 256-token window is doing as much work as the penalty value:
    # these loops drift across hundreds of tokens, so a 64-token window never
    # sees the repetition at all. Do not narrow it.
    - "--repeat-penalty"
    - "1.1"
    - "--repeat-last-n"
    - "256"
    # Proper chat template + tool calling for agentic use
    - "--jinja"
    # Extract thinking into message.reasoning_content. Without this, generations
    # were emitting a raw "</think>" mid-answer into message.content, exposing
    # the scratchpad to any client that just renders content.
    - "--reasoning-format"
    - "deepseek"
    # NOTE: -c is the TOTAL KV pool, divided across --parallel slots, so the
    # advertised per-request context is -c / --parallel. 131072 per slot x 3
    # slots = 393216 total. Raising slot count therefore costs VRAM here,
    # unlike the earlier 2->1 change which was VRAM-neutral at a fixed -c.
    #
    # 131072 per slot was measured NOT to be the cause of long-context
    # degeneration: the pod ran 2 x 131072 for 2d and still looped, so context
    # size is exonerated and the sampling/rollout gap above is the real fix.
    #
    # The model declares a 1M training context (yarn factor 16 x 65536) and 1M
    # is architecturally reachable, but not on one 80 GiB H100: this is MLA
    # (kv_lora_rank 512, v 512, 43 layers, head_count_kv 1) = 86 KiB of KV per
    # token, so 1M ctx = 86 GiB of KV alone, against ~13.7 GiB free once
    # weights are resident. 262144 costs 21.5 GiB and fits.
    #
    # Slot count is the knob here, not VRAM: KV is sized from -c, so going from
    # 2 slots to 1 is VRAM-neutral. It trades concurrency for usable context.
    - "-c"
    - "393216"
    - "--parallel"
    - "3"
    # Make context overflow a loud 400 instead of silent corruption. Context
    # shift on MLA/DeepSeek rewrites positions in a way this architecture does
    # not support, and its failure mode is fluent-but-looping text, which is
    # indistinguishable from a sampling problem. Fail fast instead.
    - "--no-context-shift"
    - "--flash-attn"
    - "on"
    # Host-RAM prompt cache. Default is 8192 MiB, and the server log showed a
    # steady stream of "making room for prompt cache entry, removing oldest
    # entry" at ~1 GiB per eviction: at 131072-token contexts a couple of
    # conversations exhaust an 8 GiB cache, so every turn re-ran prompt eval
    # (measured 35 s for a 27k-token prompt). The node has 2015 GiB of RAM, so
    # 96 GiB here is cheap and turns those evictions into cache hits.
    - "--cache-ram"
    - "98304"
    # KV stays f16. At 393216 total the KV pool is 32.3 GiB, which fits, and q8_0 KV
    # on MLA attention compounds weight quantization error. If context ever has
    # to grow past what f16 allows, this is the first knob to revisit.
    # (86 KiB of KV per token x 393216 = 32.3 GiB.)
    - "--cache-type-k"
    - "f16"
    - "--cache-type-v"
    - "f16"
    # NOTE: --cache-reuse is intentionally absent. MLA/DeepSeek contexts do not
    # support the KV shifting it needs, and llama.cpp logged
    # "cache_reuse is not supported by this context, it will be disabled".
    # Faster prompt processing on H100
    - "-b"
    - "4096"
    - "-ub"
    - "2048"
    # Read weights into RAM instead of mmap'ing them. Expert tensors resident in
    # host RAM are hit on every token, so page-fault latency is not amortized.
    # (Replaces the deprecated --no-mmap.)
    - "--load-mode"
    - "none"
    # The repo ships a 'dspark' speculative drafter. Pin this off so a future
    # llama.cpp default cannot silently claim VRAM we have not budgeted for.
    - "--spec-type"
    - "none"
    # Prometheus /metrics endpoint
    - "--metrics"

sidecar:
  image:
    repository: alpine
    tag: "3.20"
    pullPolicy: IfNotPresent
  downloadUrl: "https://github.com/cablehead/pai-sho/releases/download/v0.3.0/pai-sho-v0.3.0-linux-amd64.tar.gz"
  # Set via helmfile (secret.yaml)
  ticket: ""
  # One-time enroll token (valid 5 minutes), set via helmfile
  enrollToken: ""
  # Ports pai-sho exposes, comma separated. Defaults to the server port.
  exposePorts: "8080"
  resources: {}

scheduling:
  schedulerName: volcano
  queue: default
  priorityClassName: data-processing-priority

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    # Routed experts now run as CPU GEMMs on the critical path for every token.
    # The old 50m request would have made that pathologically slow.
    cpu: 16
    # ~62 GiB of CPU-resident experts plus loader and runtime overhead.
    memory: 80Gi
    nvidia.com/gpu: 1
  limits:
    # no CPU limit on purpose
    memory: 110Gi
    nvidia.com/gpu: 1

persistence:
  storageClass: local-path
  # 127.3 GiB of weights, leaving room for a future quant swap without a resize.
  size: 300Gi
  mountPath: /cache

nodeSelector: {}
tolerations: []
affinity: {}
