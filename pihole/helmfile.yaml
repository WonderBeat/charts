releases:
  - name: pihole
    namespace: default
    chart: ./
    values:
      - image:
          repository: pihole/pihole
          tag: 2026.07.2

      - resources:
          limits:
            memory: 250Mi
          requests:
            memory: 90Mi

      - config: |
          server=/lan.thehumanoid.ai/172.31.0.2
          server=/stage.san/10.88.101.1#55
          server=/eu-west-2.rds.amazonaws.com/10.88.101.1#55
          server=/production.san/10.88.101.1#55
          server=/internal.san/10.88.101.1#55
          server=/cluster.local/10.88.101.1#55
          address=/router.io/192.168.11.1
          address=/nasduck.synology.me/10.88.101.13
      - env:
          - name: TZ
            value: America/Chicago
          - name: FTLCONF_misc_dnsmasq_lines
            value: |
              server=/stage.san/10.88.101.1#55;
              server=/production.san/10.88.101.1#55;
              server=/internal.san/10.88.101.1#55;
              server=/cluster.local/10.88.101.1#55;
              address=/router.io/192.168.11.1;
              address=/nasduck.synology.me/10.88.101.13;
          - name: FTLCONF_webserver_api_password
            value: ""
          - name: FTLCONF_misc_etc_dnsmasq_d
            value: "true"
          # Cap long-term query-log retention. FTL defaults to 365 days, which
          # had grown /etc/pihole/pihole-FTL.db to 909MB. FTL mmaps that file
          # and replays it into memory on every startup (150k+ queries), so the
          # container sat at 249.4Mi of its 250Mi limit (99.8%) and had hit the
          # cgroup ceiling 21 times. Actual process memory is only ~55Mi; the
          # rest was page cache from the oversized database.
          - name: FTLCONF_database_maxDBdays
            value: "15"
