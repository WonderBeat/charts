apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pai-sho-proxy.fullname" . }}
  labels:
    {{- include "pai-sho-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The pai-sho identity key is a single ReadWriteOnce volume and the daemon owns
  # its socket exclusively, so a rolling update would deadlock on the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pai-sho-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the HAProxy config changes.
        checksum/haproxy-config: {{ include (print $.Template.BasePath "/configmap-haproxy.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pai-sho-proxy.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tunnel
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              wget -qO /tmp/pai-sho.tar.gz "$PAI_SHO_URL"
              tar -xzf /tmp/pai-sho.tar.gz -C /usr/local/bin --strip-components=1
              chmod +x /usr/local/bin/pai-sho

              # No surface-repinning loop here. It was written for pai-sho
              # 0.4.x, where every peer was auto-projected onto its own
              # 127.0.1.x address and HAProxy needed one peer forced back onto
              # 127.0.0.1. 0.5.2 changed the model: peers get a stable address
              # and name on their own, the first peer lands on 127.0.0.1, and
              # `surfaces` was renamed to `list` -- so the loop had become a
              # silent no-op (stderr discarded, `|| true`) that only looked
              # alive. Addressing is now explicit per port via `backendHost`,
              # read from `pai-sho list` -> .peers[].ip.
              while true; do
                pai-sho daemon --host 0.0.0.0 || true
                echo "pai-sho exited, restarting in {{ .Values.paiSho.restartDelaySeconds }}s..."
                sleep {{ .Values.paiSho.restartDelaySeconds }}
              done
          env:
            - name: PAI_SHO_URL
              value: {{ include "pai-sho-proxy.paiShoUrl" . | quote }}
          volumeMounts:
            - name: pai-sho-state
              mountPath: /root/.local/state/pai-sho
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        # pai-sho binds forwarded ports on 127.0.0.1 only (hardcoded in tunnel.rs),
        # so proxy pod-IP traffic from the Service to the localhost binding.
        # HAProxy (not socat) so that requests arriving while the tunnel is
        # down are retried instead of failing with connection refused.
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          env:
            # Referenced by haproxy.cfg to bind the pod IP only, leaving
            # 127.0.0.1 free for pai-sho's forwarded ports.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            {{- range .Values.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: {{ .Values.proxy.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: pai-sho-state
          persistentVolumeClaim:
            claimName: {{ include "pai-sho-proxy.stateClaimName" . }}
        - name: haproxy-config
          configMap:
            name: {{ include "pai-sho-proxy.fullname" . }}-haproxy
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
