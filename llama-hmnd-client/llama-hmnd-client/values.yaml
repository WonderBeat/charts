replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: alpine
  tag: "3.20"
  pullPolicy: IfNotPresent

paiSho:
  downloadUrl: "https://github.com/cablehead/pai-sho/releases/download/v0.3.0/pai-sho-v0.3.0-linux-arm64.tar.gz"
  # Reconnect quickly: this delay is added directly to every tunnel outage.
  restartDelaySeconds: 1

proxy:
  image:
    repository: haproxy
    tag: "3.0-alpine"
    pullPolicy: IfNotPresent
  # Each retry costs ~1s (verified empirically: retries=30 gives up at ~30s),
  # so this absorbs roughly this many seconds of tunnel downtime before the
  # client sees a 503. pai-sho outages last up to ~60s, so keep headroom.
  retries: 75
  # Port for HAProxy's own /healthz, kept separate from proxied traffic so
  # probes succeed even while the tunnel is down.
  healthPort: 8081
  maxconn: 2048
  timeouts:
    connect: 1s
    # Generations are long-running and streamed.
    client: 1h
    server: 1h
    httpRequest: 30s
    queue: 1m
  resources:
    requests:
      memory: 32Mi

service:
  type: ClusterIP
  # Must match the port llama server exposes
  port: 8080

persistence:
  storageClass: local-path
  size: 1Mi

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    memory: 30Mi

nodeSelector: {}
tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - arm64
