repositories:
  - name: influxdata
    url: https://helm.influxdata.com/

releases:
  - name: telegraf
    namespace: monitoring
    chart: influxdata/telegraf-ds
    strategicMergePatches:
      - apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: telegraf-telegraf-ds
        spec:
          template:
            spec:
              containers:
                - name: telegraf-ds
                  command: ["/usr/bin/telegraf"]
                  args: ["--config", "/etc/telegraf/telegraf.conf"]
                  securityContext:
                    privileged: true
                    runAsUser: 0
    values:
      - secrets.yaml
      - image:
          # slim build from ./docker.sh: 55MiB binary vs 301MiB stock (page-cache thrash under 148Mi limit)
          repo: "harbor.gladiators.dev/library/telegraf"
          tag: "1.39.3-slim"
      
      - args:
          - "telegraf"
          - "--config"
          - "/etc/telegraf/telegraf.conf"
      
      - env:
          - name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HOSTIP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          # Go sizes its heap from host RAM, not the cgroup limit, so it grew past
          # 148Mi and got OOMKilled (apol 4x, kesaram 2x). GOMEMLIMIT makes GC
          # aggressive at ~80% of the limit instead. Soft limit: no hard failure.
          - name: GOMEMLIMIT
            value: "118MiB"
      
      - resources:
          requests:
            memory: 64Mi
          limits:
            memory: 148Mi
      
      - hostNetwork: true
      - hostPID: true
      
      - podSecurityContext:
          runAsUser: 0
          runAsNonRoot: false
          fsGroup: 0
      
      - containerSecurityContext:
          privileged: true
          runAsUser: 0
      
      - rbac:
          create: true
          rules:
            - apiGroups:
                - ""
              resources:
                - nodes
                - nodes/proxy
                - nodes/stats
                - services
                - endpoints
                - pods
              verbs:
                - get
                - list
                - watch
            - nonResourceURLs:
                - /metrics
              verbs:
                - get
      
      - volumes:
          - name: varlog
            hostPath:
              path: /var/log
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
      
      - mountPoints:
          - name: varlog
            mountPath: /var/log
            readOnly: true
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true
