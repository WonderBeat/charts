# Managed by pyinfra (infra/k3s.py). Do not edit on the node.
#
# kubelet reads this file (via --resolv-conf) instead of the node's
# /etc/resolv.conf. Its purpose is to NOT carry a "search" line.
#
# Why: these nodes are cloud instances whose DHCP injects a search domain
# (k8spublic.oraclevcn.com on oracle2, vcn08261853.oraclevcn.com on others).
# kubelet copies "search" and "options" from this file into every pod, and
# pods get "options ndots:5". Any name with fewer than 5 dots is therefore
# tried against that search domain first, e.g.
#   foo.matrix.svc.cluster.local.k8spublic.oraclevcn.com
#
# oraclevcn.com is a registered domain with broken public DNS, so every
# upstream resolver (pihole, 1.1.1.1, 8.8.8.8, 9.9.9.9) returns SERVFAIL
# rather than NXDOMAIN for it. glibc treats SERVFAIL on one search candidate
# as "try the next" and recovers; musl aborts the whole lookup. Measured on
# oracle2 before this change: musl pod 27/60 name lookups failed, glibc pod
# 0/60, musl with a trailing-dot FQDN 0/60.
#
# Consequence was that conduit (a musl-static binary) failed to resolve
# 10-25% of outbound connections. Its appservice sender applied quadratic
# backoff (30s * tries^2), which is why Matrix->Slack messages arrived
# roughly one per 5 minutes. It also broke conduit's push notifications to
# push.fluffychat.im and fcm.distributor.unifiedpush.org.
#
# Note on the nameserver below: for dnsPolicy ClusterFirst (61 of 68 pods)
# kubelet substitutes cluster-dns (10.46.0.10) and only inherits the search
# and options lines from this file, so this nameserver is NOT what normal
# pods use. It applies to dnsPolicy Default pods and to hostNetwork pods
# that are silently downgraded from ClusterFirst. 1.1.1.1 is used rather
# than a per-cloud resolver so this file is identical on every node
# (node DNS varies: 169.254.169.254 on Oracle, 192.168.33.1 on xpand).
nameserver 1.1.1.1
nameserver 1.0.0.1
