replicaCount: 1

nameOverride: ""
# Pod names will be dego-dev-throwaway-0
fullnameOverride: "dego-dev-throwaway"

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: "server-cuda"
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# WHERE THE REAL TUNING LIVES
# ---------------------------------------------------------------------------
# ../helmfile.yaml.gotmpl is the source of truth for the deployed configuration:
# the model, context size, slot count, cpuMoeLayers, sampling and both hardware
# profiles are defined there, heavily annotated with the measurements behind
# each number.
#
# This file deliberately keeps only structure and conservative fallbacks, so
# `helm template ./llama-hmnd-server` still renders something runnable, and so
# there is exactly one place to edit when tuning. Do not copy profile numbers
# back here: two annotated copies drift the first time one is tuned.
# ---------------------------------------------------------------------------

# Which hardware profile to deploy. Selects a block under .Values.profiles,
# merged over .Values.server / .Values.resources / .Values.affinity.
# Set to "" to use the bare .Values.server block with no profile applied.
# An unknown name fails the render loudly rather than defaulting.
gpuProfile: 1gpu

server:
  host: "0.0.0.0"
  port: 8080
  # Tag-only reference (no modelFile) is deliberate: it makes llama.cpp resolve
  # and fetch every split on its own, whereas pinning one shard defeats split
  # resolution. Overridden per profile from the helmfile.
  model: "unsloth/DeepSeek-V4-Flash-0731-GGUF:UD-IQ4_XS"
  modelFile: ""
  gpuLayers: "all"
  # Keep the routed-expert banks of the first N layers in host RAM. Weights
  # exceed a single 80 GiB H100, so attention + shared experts stay on GPU.
  # Lower if VRAM allows (faster); raise on CUDA OOM at startup.
  cpuMoeLayers: 20

  # ---- Profile-tunable knobs ------------------------------------------------
  # These are separate keys rather than entries in extraArgs because Helm cannot
  # merge YAML lists: a list-based override would force each profile to restate
  # the entire sampling block, and the copies would drift.

  # TOTAL KV pool, divided across `parallel` slots, so advertised per-request
  # context is contextSize / parallel.
  contextSize: 262144
  parallel: 2
  cacheTypeK: f16
  cacheTypeV: f16
  # Host-RAM prompt cache, MiB. The llama.cpp default of 8192 is far too small
  # at these context sizes and causes prompt eval on every turn.
  cacheRam: 98304
  # Prompt-processing batch sizes.
  batchSize: 4096
  ubatchSize: 2048
  # Multi-GPU split. Empty means single-GPU (both flags omitted entirely).
  # 'layer' splits layers and KV across GPUs, which is what gives a multi-GPU
  # deployment a KV pool larger than one card could hold.
  splitMode: ""
  tensorSplit: ""

  # Stable model name for the API (-a/--alias), so the advertised id does not
  # change when a profile swaps the quant.
  alias: "deepseek-flash"

  # Set via helmfile (secret.yaml)
  apiKey: ""

  # Args identical across profiles. Anything hardware-dependent belongs in a
  # structured key above so profiles can override it without duplication.
  # The deployed list lives in ../helmfile.yaml.gotmpl and replaces this one.
  extraArgs:
    - "--jinja"
    - "--reasoning-format"
    - "deepseek"
    - "--no-context-shift"
    - "--flash-attn"
    - "on"
    - "--metrics"

# ---------------------------------------------------------------------------
# Hardware profiles. Merged over the blocks above; only the deltas live here.
# The deployed definitions of 1gpu and 2gpu are in ../helmfile.yaml.gotmpl;
# these entries exist so the chart renders standalone and so the profile names
# are part of the chart's own contract.
# ---------------------------------------------------------------------------
profiles:
  1gpu:
    server: {}
    resources: {}
    affinity: {}

  # 2 x H100 80GB in ONE pod. Nodes here carry 8 GPUs, so both GPUs come from a
  # single node by construction and `nvidia.com/gpu: 2` is the whole request.
  2gpu:
    server:
      splitMode: "layer"
      tensorSplit: "1,1"
    resources:
      requests:
        nvidia.com/gpu: 2
      limits:
        nvidia.com/gpu: 2
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: dego-dev-throwaway
            topologyKey: kubernetes.io/hostname

sidecar:
  image:
    repository: alpine
    tag: "3.20"
    pullPolicy: IfNotPresent
  downloadUrl: "https://github.com/cablehead/pai-sho/releases/download/v0.3.0/pai-sho-v0.3.0-linux-amd64.tar.gz"
  # Set via helmfile (secret.yaml)
  ticket: ""
  # One-time enroll token (valid 5 minutes), set via helmfile
  enrollToken: ""
  # Ports pai-sho exposes, comma separated. Defaults to the server port.
  exposePorts: "8080"
  resources: {}

scheduling:
  schedulerName: volcano
  queue: default
  priorityClassName: data-processing-priority

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# Baseline resources, overridden per profile from the helmfile.
resources:
  requests:
    # Routed experts run as CPU GEMMs on the critical path for every token, so
    # this cannot be a token request.
    cpu: 16
    memory: 80Gi
    nvidia.com/gpu: 1
  limits:
    # no CPU limit on purpose
    memory: 110Gi
    nvidia.com/gpu: 1

persistence:
  storageClass: local-path
  # Sized for the largest profile: UD-Q8_K_XL is 150.8 GiB, UD-IQ4_XS 127.3 GiB.
  # 300Gi holds either with room for a quant swap without a resize (PVCs here
  # cannot be expanded in place on local-path).
  size: 300Gi
  mountPath: /cache

nodeSelector: {}
tolerations: []
affinity: {}
