# pg_dump -U coder coder > /tmp/coder.sql
# psql -U coder -d coder < /tmp/coder.sql
repositories:
  - name: coder-v2
    url: https://helm.coder.com/v2
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
releases:
  - name: coder-db
    namespace: db
    createNamespace: true
    chart: bitnami/postgresql
    version: 16.7.27
    values:
      - image:
          repository: bitnamilegacy/postgresql
          tag: 16.6.0
      - primary:
          # Default is 100. Coder holds ~4 pooled connections, and every idle backend
          # is a process costing 15-38Mi RSS, so the default headroom is worth more
          # than it buys inside a 600Mi limit.
          extendedConfiguration: |
            max_connections = 50
          resources:
            requests:
                memory: 400Mi
            limits:
                memory: 600Mi
          # Was zone=germany, which pinned this to k8s-2 (the only germany node).
          # k8s-2 has been cordoned for maintenance, so the pod could not be
          # scheduled. Allow the oracle zones (kesaram, nagi, jonapot) and
          # oracle_eu_andrey (oracle1/2/3) instead.
          #
          # NOTE: storageClass is local-path, so the PV is pinned to whichever
          # node first binds it. Moving nodes therefore requires a data
          # migration (pg_dump/restore), not just a reschedule. Consider a
          # replicated storage class if this needs to move freely.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - oracle
                      - oracle_eu_andrey
      - secret.yaml
  - name: coder
    namespace: coder
    createNamespace: true
    needs:
      - db/coder-db
    chart: coder-v2/coder
    # Pinned deliberately. Without this, the chart floats to whatever is latest
    # in the repo, so an unrelated values change (e.g. fixing resources) would
    # also drag in a Coder app upgrade with Postgres schema migrations. The
    # running version was 2.32.0 while latest had moved to 2.35.3. Bump this
    # line as its own reviewed commit, not as a side effect.
    version: 2.32.0
    values:
      - coder:
          # NOTE: this block used to be
          #     resources:
          #       memory:
          #         requests: 100Mi
          # which is not the k8s ResourceRequirements schema, so Helm rendered
          # `resources: {}` and the pod ran as BestEffort QoS with no CPU
          # request at all. Under node pressure the scheduler/CFS gave coderd
          # whatever was left over, which shows up as a laggy web UI (the SPA
          # fires ~150 module + API requests on load, and each one waits on
          # coderd CPU). Real requests/limits below.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # image:
          #   tag: v2.10.2
          env:
            # - name: CODER_DERP_SERVER_ENABLE
            #   value: "false"

            # WebGL terminal renderer is noticeably faster than the default
            # canvas renderer, especially over a high-latency tunnel.
            - name: CODER_WEB_TERMINAL_RENDERER
              value: "webgl"
            # Serve /metrics so UI slowness can actually be measured
            # (coderd_api_request_latencies_seconds) instead of guessed at.
            - name: CODER_PROMETHEUS_ENABLE
              value: "true"
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  # You'll need to create a secret called coder-db-url with your
                  # Postgres connection URL like:
                  # postgres://coder:password@postgres:5432/coder?sslmode=disable
                  name: coder-db-url
                  key: url
            - name: CODER_ACCESS_URL
              value: "https://coder.gladiators.dev"
          ingress:
            enable: true
            className: traefik
            host: coder.gladiators.dev
          service:
            enable: true
            type: ClusterIP

  - name: coder-permissions
    namespace: coder
    chart: main/raw
    values:
      - resources:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: coder-user
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: coder-pod-creator
          rules:
          - apiGroups: [""]
            resources: ["pods", "secrets", "pods/exec", "services", "pods/portforward"]
            verbs: ["create", "get", "watch", "list", "delete", "update"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["create", "get", "watch", "list"]
          - apiGroups: ["apps"]
            resources: ["deployments", "statefulsets"]
            verbs: ["create", "get", "watch", "list", "delete", "update", "patch"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            verbs: ["create", "get", "watch", "list", "patch", "update"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: coder-pod-creator
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: coder-pod-creator
          subjects:
          - kind: ServiceAccount
            name: coder-user

